<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – Onigiri-giri</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>🍙 Onigiri-giri</h1>
    <p>Quick Quiz</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="hiragana.html">Hiragana</a>
    <a href="katakana.html">Katakana</a>
    <a href="kanji.html">Kanji</a>
    <a href="vocab.html">Vocabulary</a>
    <a href="quiz.html">Quiz</a>
  </nav>
  <main>
    <section class="card">
      <h2>Choose a Quiz</h2>
      <div id="modeButtons" style="display:flex; flex-wrap:wrap; gap:0.8rem; margin-bottom:1.2rem;">
        <button class="mode-btn" data-mode="hiragana">Hiragana</button>
        <button class="mode-btn" data-mode="katakana">Katakana</button>
        <button class="mode-btn" data-mode="mixed">Mixed</button>
        <button class="mode-btn" data-mode="kanji">Kanji</button>
      </div>

      <div id="quizArea">
        <p id="question" style="font-size:1.2rem;">Select a mode above to start</p>
        <div id="options" style="display:flex; flex-direction:column; gap:0.8rem; margin:1rem 0;"></div>
        <p id="score" style="font-weight:500;"></p>
        <button id="startQuiz" style="padding:1rem 1.6rem; font-size:1.2rem; background:#e85d04; color:white; border:none; border-radius:10px; min-height:56px; width:100%; max-width:280px; display:none;">Start</button>
      </div>
    </section>
  </main>
  <footer><p>Onigiri-giri</p></footer>
  <script src="script.js"></script>
</body>
</html>
