<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missions – Onigiri-giri</title>
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="icon" type="image/png" href="icon-header.png">
  <meta name="color-scheme" content="dark">
  <style>
    .path-map { padding: 1rem; max-width: 400px; margin: 0 auto; }
    .category-header { text-align: center; color: #e85d04; font-size: 0.9rem; font-weight: 600; margin: 1.5rem 0 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .path-row { display: flex; align-items: center; justify-content: center; height: 70px; position: relative; }
    .path-row.left { justify-content: flex-start; padding-left: 20px; }
    .path-row.right { justify-content: flex-end; padding-right: 20px; }
    .path-dot { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    .path-dot.locked { background: #2a2a2a; color: #555; cursor: default; box-shadow: 0 3px 0 #1a1a1a; }
    .path-dot.current { background: linear-gradient(180deg, #ff7a1a, #e85d04); color: white; box-shadow: 0 4px 0 #c44a00; animation: pulse 2s infinite; }
    .path-dot.done { background: linear-gradient(180deg, #9c27b0, #7b1fa2); color: white; box-shadow: 0 4px 0 #5a1575; }
    .path-dot:not(.locked):hover { transform: scale(1.15) translateY(-2px); }
    .path-connector { position: absolute; width: 60%; height: 4px; background: #333; border-radius: 2px; top: 50%; }
    .path-connector.done { background: #7b1fa2; }
    .path-row.left .path-connector { right: 10%; }
    .path-row.right .path-connector { left: 10%; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html"><img class="site-logo" src="icon-header.png" alt="Onigiri-giri">Onigiri-giri</a></h1>
    <p>Missions</p>
    <button class="menu-toggle" aria-label="Menu">☰</button>
  </header>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="missions.html" class="active">Missions</a>
    <a href="review.html">Review</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logout-btn" style="margin-left:auto;">Logout</a>
  </nav>
  <div class="layout">
    <aside class="sidebar left-sidebar">
      <div class="card">
        <h3>Path</h3>
        <div class="progress-item"><span id="sidebar-path">No path</span></div>
      </div>
      <div class="card">
        <h3>Total</h3>
        <div class="progress-item"><span>Hiragana</span><span id="prog-hira">0/46</span></div>
        <div class="progress-item"><span>Katakana</span><span id="prog-kata">0/46</span></div>
        <div class="progress-item"><span>Kanji</span><span id="prog-kanji">0/500</span></div>
        <div class="progress-item"><span>Streak</span><span id="streak">0 days</span></div>
      </div>
    </aside>
    <main>
      <section class="card">
        <h2 id="path-name">Missions</h2>
        <p id="progress"></p>
        <div id="missions"></div>
      </section>
    </main>
    <aside class="sidebar right-sidebar">
      <div class="card">
        <h3>Daily Word</h3>
        <div class="daily-word" id="daily-word">仕事</div>
        <div class="daily-romaji" id="daily-romaji">shigoto</div>
        <div class="daily-meaning" id="daily-meaning">work / job</div>
      </div>
      <div class="card">
        <h3>Studying Tips</h3>
        <p id="studying-tip">Complete missions in order.</p>
      </div>
    </aside>
  </div>
  <footer><p>Onigiri-giri · Free Japanese Learning site</p></footer>
  <script src="lessons.js"></script>
  <script src="sidebar.js?v=6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="progress-sync.js?v=2"></script>
  <script>
    const pathData = JSON.parse(localStorage.getItem('og-paths') || '{"current":null,"progress":{}}');
    
    if (!pathData.current) {
      location.href = 'index.html';
    }
    
    function render() {
      const freshData = JSON.parse(localStorage.getItem('og-paths') || '{"current":null,"progress":{}}');
      const path = freshData.current;
      const lessons = LESSONS[path] || [];
      
      if (freshData.progress[path] && !freshData.progress[path].completed) {
        freshData.progress[path].completed = [];
        localStorage.setItem('og-paths', JSON.stringify(freshData));
      }
      const completed = freshData.progress[path]?.completed || [];
      
      let currentIndex = lessons.findIndex(l => !completed.includes(l.id));
      if (currentIndex === -1) currentIndex = lessons.length;
      
      document.getElementById('path-name').textContent = path.charAt(0).toUpperCase() + path.slice(1);
      document.getElementById('progress').textContent = completed.length + '/' + lessons.length;
      
      const categoriesByPath = {
        beginner: [
          { name: 'Hiragana', start: 0, end: 10 },
          { name: 'Katakana', start: 10, end: 20 },
          { name: 'Kanji', start: 20, end: 35 },
          { name: 'Vocabulary', start: 35, end: 50 }
        ],
        apprentice: [
          { name: 'Kanji', start: 0, end: 15 },
          { name: 'Vocabulary', start: 15, end: 30 },
          { name: 'Sentences', start: 30, end: 50 }
        ]
      };
      const categories = categoriesByPath[path] || [];
      
      let html = '<div class="path-map">';
      
      categories.forEach(cat => {
        html += '<div class="category-header">' + cat.name + '</div>';
        for (let i = cat.start; i < cat.end && i < lessons.length; i++) {
          const l = lessons[i];
          let cls = 'locked';
          if (completed.includes(l.id)) cls = 'done';
          else if (i === currentIndex) cls = 'current';
          
          const side = (i % 2 === 0) ? 'left' : 'right';
          html += '<div class="path-row ' + side + '">';
          if (i > cat.start) {
            html += '<div class="path-connector ' + (i <= currentIndex ? 'done' : '') + '"></div>';
          }
          html += '<div class="path-dot ' + cls + '"' + (cls !== 'locked' ? ' onclick="play(\'' + l.id + '\')"' : '') + '>' + (i + 1) + '</div>';
          html += '</div>';
        }
      });
      
      html += '</div>';
      document.getElementById('missions').innerHTML = html;
    }
    
    function play(lessonId) {
      const current = JSON.parse(localStorage.getItem('og-paths')).current;
      location.href = 'lesson.html?id=' + lessonId + '&path=' + current;
    }
    
    setTimeout(render, 1000);
  </script>
</body>
</html>
