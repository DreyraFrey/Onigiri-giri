<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missions – Onigiri-giri</title>
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="icon" type="image/png" href="icon-header.png">
  <meta name="color-scheme" content="dark">
  <style>
    .path-map { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1rem 0; }
    .path-dot { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 3px solid transparent; transition: transform 0.1s; }
    .path-dot.locked { background: #333; color: #666; cursor: default; }
    .path-dot.current { background: #e85d04; color: white; }
    .path-dot.done { background: #7b1fa2; color: white; }
    .path-dot:not(.locked):hover { transform: scale(1.1); }
    .path-label { font-size: 0.8rem; color: #aaa; text-align: center; max-width: 100px; }
    .path-row { display: flex; align-items: center; gap: 0.5rem; }
    .path-line { width: 3px; height: 20px; background: #333; }
    .path-line.done { background: #7b1fa2; }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html"><img class="site-logo" src="icon-header.png" alt="Onigiri-giri">Onigiri-giri</a></h1>
    <p>Missions</p>
    <button class="menu-toggle" aria-label="Menu">☰</button>
  </header>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="missions.html" class="active">Missions</a>
    <a href="review.html">Review</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logout-btn" style="margin-left:auto;">Logout</a>
  </nav>
  <div class="layout">
    <aside class="sidebar left-sidebar">
      <div class="card">
        <h3>Path</h3>
        <div class="progress-item"><span id="sidebar-path">No path</span></div>
      </div>
      <div class="card">
        <h3>Total</h3>
        <div class="progress-item"><span>Hiragana</span><span id="prog-hira">0/46</span></div>
        <div class="progress-item"><span>Katakana</span><span id="prog-kata">0/46</span></div>
        <div class="progress-item"><span>Kanji</span><span id="prog-kanji">0/500</span></div>
        <div class="progress-item"><span>Streak</span><span id="streak">0 days</span></div>
      </div>
    </aside>
    <main>
    <section class="card">
      <h2 id="path-name">Missions</h2>
      <div id="missions"></div>
    </section>
  </main>
    <aside class="sidebar right-sidebar">
      <div class="card">
        <h3>Daily Word</h3>
        <div class="daily-word" id="daily-word">仕事</div>
        <div class="daily-romaji" id="daily-romaji">shigoto</div>
        <div class="daily-meaning" id="daily-meaning">work / job</div>
      </div>
      <div class="card">
        <h3>Studying Tips</h3>
        <p id="studying-tip">Complete missions in order.</p>
      </div>
    </aside>
  </div>
  <footer><p>Onigiri-giri · Free Japanese Learning site</p></footer>
  <script src="lessons.js"></script>
  <script src="sidebar.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
  <script>
    const pathData = JSON.parse(localStorage.getItem('og-paths') || '{"current":null,"progress":{}}');
    
    if (!pathData.current) {
      location.href = 'index.html';
    }
    
    function render() {
      const path = pathData.current;
      const lessons = LESSONS[path] || [];
      const completed = pathData.progress[path]?.completed || [];
      const currentIndex = completed.length;
      
      document.getElementById('path-name').textContent = path.charAt(0).toUpperCase() + path.slice(1);
      document.getElementById('progress').textContent = completed.length + '/' + lessons.length;
      
      let html = '<div class="path-map">';
      lessons.forEach((l, i) => {
        let cls = 'locked';
        if (i < currentIndex) cls = 'done';
        else if (i === currentIndex) cls = 'current';
        
        if (i > 0) {
          html += '<div class="path-line ' + (i <= currentIndex ? 'done' : '') + '"></div>';
        }
        html += '<div class="path-row">';
        html += '<div class="path-dot ' + cls + '"' + (cls !== 'locked' ? ' onclick="play(\'' + l.id + '\')"' : '') + '>' + (i + 1) + '</div>';
        html += '<div class="path-label">' + l.name + '</div>';
        html += '</div>';
      });
      html += '</div>';
      document.getElementById('missions').innerHTML = html;
    }
    
    function play(lessonId) {
      location.href = 'lesson.html?id=' + lessonId + '&path=' + pathData.current;
    }
    
    render();
  </script>
</body>
</html>
