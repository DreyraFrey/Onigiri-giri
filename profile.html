<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile – Onigiri-giri</title>
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="icon" type="image/png" href="icon-header.png">
  <meta name="color-scheme" content="dark">
  <style>
    .path-card { border: 2px solid #333; border-radius: 12px; padding: 1rem; margin: 0.5rem 0; cursor: pointer; }
    .path-card.active { border-color: #e85d04; background: rgba(232,93,4,0.1); }
    .path-card h3 { margin: 0 0 0.5rem; }
    .milestone { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
    .milestone.done { color: #4caf50; }
    .badge { display: inline-block; padding: 0.3rem 0.6rem; background: #e85d04; border-radius: 4px; font-size: 0.85rem; margin: 0.2rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; margin: 1rem 0; }
    .stat { background: var(--surface); padding: 0.8rem; border-radius: 8px; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; color: #e85d04; }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html"><img class="site-logo" src="icon-header.png" alt="Onigiri-giri">Onigiri-giri</a></h1>
    <p>Profile</p>
    <button class="menu-toggle" aria-label="Menu">☰</button>
  </header>
  <div class="mobile-progress">
    <span>あ <b id="m-hira">0</b></span>
    <span>ア <b id="m-kata">0</b></span>
    <span>漢 <b id="m-kanji">0</b></span>
    <span>🔥 <b id="m-streak">0</b></span>
  </div>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="missions.html">Missions</a>
    <a href="review.html">Review</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logout-btn" style="margin-left:auto;">Logout</a>
  </nav>
  <div class="layout">
    <aside class="sidebar left-sidebar">
      <div class="card">
        <h3>Progress</h3>
        <div class="progress-item"><span>Hiragana</span><span id="prog-hira">0/46</span></div>
        <div class="progress-item"><span>Katakana</span><span id="prog-kata">0/46</span></div>
        <div class="progress-item"><span>Kanji</span><span id="prog-kanji">0/500</span></div>
        <div class="progress-item"><span>Vocab</span><span id="prog-vocab">0</span></div>
        <div class="progress-item"><span>Streak</span><span id="streak">0 days</span></div>
      </div>
    </aside>
    <main>
      <section class="card">
        <h2>Stats</h2>
        <div class="stats" id="stats"></div>
      </section>
      <section class="card">
        <h2>Badges</h2>
        <div id="badges"></div>
      </section>
      <section class="card">
        <h2>Choose Path</h2>
        <div id="paths"></div>
      </section>
    </main>
    <aside class="sidebar right-sidebar">
      <div class="card">
        <h3>Daily Word</h3>
        <div class="daily-word" id="daily-word">仕事</div>
        <div class="daily-romaji" id="daily-romaji">shigoto</div>
        <div class="daily-meaning" id="daily-meaning">work / job</div>
      </div>
      <div class="card">
        <h3>Studying Tips</h3>
        <p id="studying-tip">Pick a path and stick with it.</p>
      </div>
    </aside>
  </div>
  <footer><p>Onigiri-giri · Free Japanese Learning site</p></footer>
  <script src="sidebar.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
  <script>
    const PATHS = {
      beginner: {
        name: 'Beginner',
        desc: 'Learn the basics: kana, simple vocab, and your first kanji.',
        milestones: ['Learn all hiragana', 'Learn all katakana', 'Learn 50 kanji', 'Complete 5 quizzes'],
        exam: 'Vocab Exam (Beginner)',
        badge: 'Beginner Badge'
      },
      apprentice: {
        name: 'Apprentice',
        desc: 'Build on the basics with more kanji and real sentences.',
        milestones: ['Learn 150 kanji', 'Complete 10 quizzes', 'Pass Reading Exam (Beginner)', 'Learn 100 vocab'],
        exam: 'Reading Exam (Adept)',
        badge: 'Apprentice Badge'
      },
      master: {
        name: 'Master',
        desc: 'Tackle advanced content and prove your skills.',
        milestones: ['Learn 300 kanji', 'Pass Vocab Exam (Expert)', 'Pass Reading Exam (Expert)', '7-day streak'],
        exam: 'Reading Exam (Expert)',
        badge: 'Master Badge'
      }
    };

    function getPaths() {
      return JSON.parse(localStorage.getItem('og-paths') || '{"current":null,"progress":{}}');
    }

    function setPath(id) {
      const data = getPaths();
      data.current = id;
      if (!data.progress[id]) data.progress[id] = { milestones: [], badge: false };
      localStorage.setItem('og-paths', JSON.stringify(data));
      window.location.href = 'missions.html';
      render();
    }

    function render() {
      const data = getPaths();
      const streak = JSON.parse(localStorage.getItem('og-streak') || '{"days":0}');
      
      document.getElementById('stats').innerHTML = `
        <div class="stat"><b>${streak.days}</b>Day streak</div>
        <div class="stat"><b>${data.current || 'None'}</b>Current path</div>
      `;

      const badges = Object.entries(data.progress).filter(([k,v]) => v.badge).map(([k]) => PATHS[k].badge);
      document.getElementById('badges').innerHTML = badges.length 
        ? badges.map(b => `<span class="badge">${b}</span>`).join('')
        : '<p>No badges yet. Complete a path exam to earn one.</p>';

      document.getElementById('paths').innerHTML = Object.entries(PATHS).map(([id, p]) => `
        <div class="path-card ${data.current === id ? 'active' : ''}" onclick="setPath('${id}')">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          ${p.milestones.map(m => `<div class="milestone">${m}</div>`).join('')}
          <p style="margin-top:0.5rem;"><b>Final exam:</b> ${p.exam}</p>
          <p><b>Reward:</b> ${p.badge}</p>
        </div>
      `).join('');
    }

    document.querySelector('.menu-toggle').onclick = () => document.getElementById('nav').classList.toggle('open');
    render();
  </script>
</body>
</html>
